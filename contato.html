<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural - Lorde Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <span class="logo">LORDE</span> 
        <nav class="menu">
            <a href="index.html">
                Discografia
            </a>
            <a href="sobre.html">Biografia</a>
            <a href="contato.html" class="ativo">Mural</a>
        </nav>
    </header>

    <main>
        <section class="conteudo">
            <h1>Mural de Melodramas</h1>
            <p>Deixe seus pensamentos mais profundos ou envie um sinal verde no formulário abaixo</p>

            <form class="form" action="#">
                <div class="campo">
                    <label for="nome">Como devemos te chamar? (Um codinome de Royal)</label>
                    <input type="text" id="nome" name="name" placeholder="Ex: A Perfect Place Resident">
                </div>
                <div class="campo">
                    <label for="email">Seu canal de sintonia (E-mail)</label>
                    <input type="email" id="email" name="email" placeholder="voce@liability.com">
                </div>
                <div class="campo">
                    <label for="msg">Seus segredos da noite (Mensagem)</label>
                    <textarea name="msg" id="msg" rows="4" placeholder="Escreva aqui tudo o que passa na sua mente quando as luzes se apagam..."></textarea>
                </div>
                <button type="submit" class="botao">
                    Enviar Sinal Verde
                </button>
            </form>
        </section>
    </main>
    
    <footer class="rodape">
        <p>luci do 2DAT2 • Green Light Project</p>
    </footer>
</body>
</html>
